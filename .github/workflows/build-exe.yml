# 手动触发（Actions → build-exe → Run workflow）或推送 v* 标签时在 Windows 上打包 exe。
# 推送标签（如 v1.0.0）时会自动创建 Release 并附上 exe。
name: build-exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sqlalchemy pymysql psycopg2-binary oracledb pyodbc pyinstaller
      - run: python build_exe.py
      - uses: actions/upload-artifact@v4
        with:
          name: DBDiff-windows
          path: dist/*.exe
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
